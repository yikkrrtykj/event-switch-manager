name: Foundation CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, foundation]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create isolated Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { '.venv/Scripts' } else { '.venv/bin' }
          (Resolve-Path $bin).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -c constraints-py312.txt ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest -q

  frontend:
    name: Web and Playwright (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The locked Playwright release supports Ubuntu 24.04.
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create isolated Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { '.venv/Scripts' } else { '.venv/bin' }
          (Resolve-Path $bin).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - id: web-build
        run: npm run build
      - run: python -m pip install -c ../api/constraints-py312.txt ../api
      - run: python -m pip check
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - run: npm run test:e2e
      - run: npm run test:e2e
        env:
          ESM_E2E_VITE: '1'
      - name: Checkout pinned Hallmark v2
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' && runner.os == 'Linux' && github.event_name == 'pull_request' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Nutlope/hallmark
          ref: 04977e15f3dfd6ee4b74c887dac3eb52665d6c92
          path: .review/hallmark
          persist-credentials: false
      - name: Hallmark App Screens review
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' && runner.os == 'Linux' && github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/web-before" "$RUNNER_TEMP/hallmark-tools"
          git -C "$GITHUB_WORKSPACE" archive "$BASE_SHA" apps/web | tar -x -C "$RUNNER_TEMP/web-before"
          (cd "$RUNNER_TEMP/web-before/apps/web" && npm ci --no-audit --no-fund && npm run build)
          npm install --prefix "$RUNNER_TEMP/hallmark-tools" --no-save --package-lock=false puppeteer-core@24
          CHROMIUM=$(node -p "require('playwright').chromium.executablePath()")
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox "$@"\n' "$CHROMIUM" > "$RUNNER_TEMP/chromium-review"
          chmod +x "$RUNNER_TEMP/chromium-review"
          CHROME_PATH="$RUNNER_TEMP/chromium-review" HALLMARK_PUPPETEER="$RUNNER_TEMP/hallmark-tools" \
            node scripts/hallmark-review.mjs "$GITHUB_WORKSPACE/.review/hallmark/skills/hallmark/scripts/sloplint.mjs" \
              "$RUNNER_TEMP/web-before/apps/web" "$RUNNER_TEMP"
      - name: Upload browser review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: planner-browser-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            apps/web/test-results
            apps/web/test-results-vite
            apps/web/.hallmark

  windows-portable:
    name: Windows Portable Runtime
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build static UI
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Create packaging environment
        shell: pwsh
        run: |
          python -m venv .venv-packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = '.venv-packaging/Scripts'
          (Resolve-Path $bin).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $py = ".venv-packaging/Scripts/python.exe"
          & $py -m pip install -c apps/api/constraints-py312.txt ./apps/api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -r apps/api/packaging/requirements-packaging.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip check
      - name: Build Windows onedir package
        shell: pwsh
        run: |
          $packagingPython = (Resolve-Path ".venv-packaging/Scripts/python.exe").Path
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/api/packaging/build_windows.ps1 `
            -Python $packagingPython `
            -WebDist "apps/web/dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual EXE smoke test with default LOCALAPPDATA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $defaultData = Join-Path $env:LOCALAPPDATA "EventSwitchManager"
          if (Test-Path $defaultData) { Remove-Item -LiteralPath $defaultData -Recurse -Force }
          $workspace = Join-Path $env:RUNNER_TEMP "esm-portable-smoke"
          if (Test-Path $workspace) { Remove-Item -LiteralPath $workspace -Recurse -Force }
          python apps/api/packaging/smoke_windows.py `
            --exe "apps/api/dist/EventSwitchManager/EventSwitchManager.exe" `
            --workspace $workspace `
            --report "apps/api/dist/EventSwitchManager-smoke-report.json" `
            --build-record "apps/api/dist/EventSwitchManager-build-record.json" `
            --zip "apps/api/dist/EventSwitchManager-windows-x64.zip" `
            --expected-git-sha "$env:EXPECTED_HEAD_SHA" `
            --use-default-database
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content "apps/api/dist/EventSwitchManager-smoke-report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne "passed") { throw "Portable smoke report did not pass." }
          Write-Output "Portable smoke checks: $($report.checks -join ', ')"
      - name: Preserve raw Windows smoke logs
        if: always()
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "esm-portable-smoke"
          $logDir = "apps/api/dist/EventSwitchManager-smoke-logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          if (Test-Path $workspace) {
            Copy-Item -Path (Join-Path $workspace "*.log") -Destination $logDir -Force
          }
      - name: Upload Windows portable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-portable-runtime
          if-no-files-found: warn
          path: |
            apps/api/dist/EventSwitchManager-windows-x64.zip
            apps/api/dist/EventSwitchManager-build-record.json
            apps/api/dist/EventSwitchManager-smoke-report.json
            apps/api/dist/EventSwitchManager-smoke-logs

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan Git history
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner
