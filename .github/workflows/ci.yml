name: Foundation CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, foundation]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create isolated Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { '.venv/Scripts' } else { '.venv/bin' }
          (Resolve-Path $bin).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -c constraints-py312.txt ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest -q

  frontend:
    name: Web and Playwright (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The locked Playwright release supports Ubuntu 24.04.
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create isolated Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { '.venv/Scripts' } else { '.venv/bin' }
          (Resolve-Path $bin).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - id: web-build
        run: npm run build
      - run: python -m pip install -c ../api/constraints-py312.txt ../api
      - run: python -m pip check
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - run: npm run test:e2e
      - run: npm run test:e2e
        env:
          ESM_E2E_VITE: '1'
      - name: Checkout pinned Hallmark v2
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' && runner.os == 'Linux' && github.event_name == 'pull_request' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Nutlope/hallmark
          ref: 04977e15f3dfd6ee4b74c887dac3eb52665d6c92
          path: .review/hallmark
          persist-credentials: false
      - name: Hallmark App Screens review
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' && runner.os == 'Linux' && github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/web-before" "$RUNNER_TEMP/hallmark-tools"
          git -C "$GITHUB_WORKSPACE" archive "$BASE_SHA" apps/web | tar -x -C "$RUNNER_TEMP/web-before"
          (cd "$RUNNER_TEMP/web-before/apps/web" && npm ci --no-audit --no-fund && npm run build)
          npm install --prefix "$RUNNER_TEMP/hallmark-tools" --no-save --package-lock=false puppeteer-core@24
          CHROMIUM=$(node -p "require('playwright').chromium.executablePath()")
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox "$@"\n' "$CHROMIUM" > "$RUNNER_TEMP/chromium-review"
          chmod +x "$RUNNER_TEMP/chromium-review"
          CHROME_PATH="$RUNNER_TEMP/chromium-review" HALLMARK_PUPPETEER="$RUNNER_TEMP/hallmark-tools" \
            node scripts/hallmark-review.mjs "$GITHUB_WORKSPACE/.review/hallmark/skills/hallmark/scripts/sloplint.mjs" \
              "$RUNNER_TEMP/web-before/apps/web" "$RUNNER_TEMP"
      - name: Upload browser review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: planner-browser-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            apps/web/test-results
            apps/web/test-results-vite
            apps/web/.hallmark

  windows-portable:
    name: Windows Portable Runtime
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build static UI
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Create packaging environment
        shell: pwsh
        run: |
          python -m venv .venv-packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = '.venv-packaging/Scripts'
          (Resolve-Path $bin).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $py = ".venv-packaging/Scripts/python.exe"
          & $py -m pip install -c apps/api/constraints-py312.txt ./apps/api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -r apps/api/packaging/requirements-packaging.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip check
      - name: Build Windows onedir package
        shell: pwsh
        run: |
          $packagingPython = (Resolve-Path ".venv-packaging/Scripts/python.exe").Path
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/api/packaging/build_windows.ps1 `
            -Python $packagingPython `
            -WebDist "apps/web/dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual EXE smoke test with default LOCALAPPDATA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $defaultData = Join-Path $env:LOCALAPPDATA "EventSwitchManager"
          if (Test-Path $defaultData) { Remove-Item -LiteralPath $defaultData -Recurse -Force }
          $workspace = Join-Path $env:RUNNER_TEMP "esm-portable-smoke"
          if (Test-Path $workspace) { Remove-Item -LiteralPath $workspace -Recurse -Force }
          python apps/api/packaging/smoke_windows.py `
            --exe "apps/api/dist/EventSwitchManager/EventSwitchManager.exe" `
            --workspace $workspace `
            --report "apps/api/dist/EventSwitchManager-smoke-report.json" `
            --build-record "apps/api/dist/EventSwitchManager-build-record.json" `
            --zip "apps/api/dist/EventSwitchManager-windows-x64.zip" `
            --expected-git-sha "$env:EXPECTED_HEAD_SHA" `
            --use-default-database
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content "apps/api/dist/EventSwitchManager-smoke-report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne "passed") { throw "Portable smoke report did not pass." }
          Write-Output "Portable smoke checks: $($report.checks -join ', ')"
      - name: Run percent-path EXE smoke
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "中文 100% portable"
          if (Test-Path $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -LiteralPath "apps/api/dist/EventSwitchManager-windows-x64.zip" `
            -DestinationPath $extract -Force
          $workspace = Join-Path $env:RUNNER_TEMP "esm-portable-percent-smoke"
          if (Test-Path $workspace) { Remove-Item -LiteralPath $workspace -Recurse -Force }
          python apps/api/packaging/smoke_windows.py `
            --exe (Join-Path $extract "EventSwitchManager\EventSwitchManager.exe") `
            --workspace $workspace `
            --report "apps/api/dist/EventSwitchManager-smoke-percent-report.json" `
            --build-record "apps/api/dist/EventSwitchManager-build-record.json" `
            --zip "apps/api/dist/EventSwitchManager-windows-x64.zip" `
            --database "$env:RUNNER_TEMP\esm-percent-smoke.sqlite3" `
            --expected-git-sha "$env:EXPECTED_HEAD_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content "apps/api/dist/EventSwitchManager-smoke-percent-report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne "passed") { throw "Percent-path smoke report did not pass." }
          Write-Output "Percent-path checks: $($report.checks -join ', ')"
      - name: Preserve raw Windows smoke logs
        if: always()
        shell: pwsh
        run: |
          $workspaces = [ordered]@{
            "EventSwitchManager-smoke-logs" = (Join-Path $env:RUNNER_TEMP "esm-portable-smoke")
            "EventSwitchManager-smoke-logs-percent" = (Join-Path $env:RUNNER_TEMP "esm-portable-percent-smoke")
          }
          foreach ($pair in $workspaces.GetEnumerator()) {
            $logDir = Join-Path "apps/api/dist" $pair.Key
            New-Item -ItemType Directory -Force -Path $logDir | Out-Null
            if (Test-Path $pair.Value) {
              Copy-Item -Path (Join-Path $pair.Value "*.log") -Destination $logDir -Force
            }
          }
      - name: Upload Windows portable runtime (single extraction)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-portable-runtime
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            apps/api/dist/EventSwitchManager/**
            apps/api/dist/EventSwitchManager-build-record.json
      - name: Upload Windows portable engineering archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-portable-build-archive
          if-no-files-found: warn
          path: |
            apps/api/dist/EventSwitchManager-windows-x64.zip
            apps/api/dist/EventSwitchManager-build-record.json
      - name: Upload Windows portable smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-portable-smoke-evidence
          if-no-files-found: warn
          path: |
            apps/api/dist/EventSwitchManager-smoke-report.json
            apps/api/dist/EventSwitchManager-smoke-percent-report.json
            apps/api/dist/EventSwitchManager-smoke-logs
            apps/api/dist/EventSwitchManager-smoke-logs-percent
      - name: Download Windows portable artifact once
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-runtime
          path: ${{ runner.temp }}/portable-downloaded
      - name: Verify one-extraction Windows portable runtime
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "portable-downloaded"
          $exe = Get-ChildItem -LiteralPath $root -Filter "EventSwitchManager.exe" -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw "Portable EXE missing after a single artifact extraction." }
          $nested = Get-ChildItem -LiteralPath $root -Filter "*.zip" -Recurse -File |
            Where-Object { $_.FullName -notmatch "\\_internal\\" -and $_.Name -ne "base_library.zip" }
          if ($nested) {
            throw "Portable user artifact still contains a nested build ZIP."
          }
          Write-Output "One-extraction portable runtime: $($exe.FullName)"

  windows-console-lab:
    name: Windows Console Lab Runner
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create ConsoleLab packaging environment
        shell: pwsh
        run: |
          python -m venv .venv-lab-packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = '.venv-lab-packaging/Scripts'
          (Resolve-Path $bin).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $py = ".venv-lab-packaging/Scripts/python.exe"
          & $py -m pip install -c apps/api/constraints-py312.txt ./apps/api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -r apps/api/packaging/requirements-packaging.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip check
      - name: Build isolated ConsoleLab artifact
        shell: pwsh
        run: |
          $packagingPython = (Resolve-Path ".venv-lab-packaging/Scripts/python.exe").Path
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/api/packaging/console_lab/build_console_lab.ps1 `
            -Python $packagingPython
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline ConsoleLab artifact smoke (no COM open)
        shell: pwsh
        run: |
          python apps/api/packaging/console_lab/smoke_console_lab.py `
            --package "apps/api/dist-console-lab/EventSwitchManager-ConsoleLab" `
            --report "apps/api/dist-console-lab/EventSwitchManager-ConsoleLab-smoke-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content "apps/api/dist-console-lab/EventSwitchManager-ConsoleLab-smoke-report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne "passed") { throw "ConsoleLab smoke report did not pass." }
          Write-Output "ConsoleLab smoke checks: $($report.checks -join ', ')"
      - name: Percent-path ConsoleLab smoke (no COM open)
        shell: pwsh
        run: |
          $percentRoot = Join-Path $env:RUNNER_TEMP "中文 100% ConsoleLab"
          if (Test-Path $percentRoot) { Remove-Item -LiteralPath $percentRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $percentRoot | Out-Null
          Copy-Item -Path "apps/api/dist-console-lab/EventSwitchManager-ConsoleLab" `
            -Destination (Join-Path $percentRoot "EventSwitchManager-ConsoleLab") -Recurse -Force
          python apps/api/packaging/console_lab/smoke_console_lab.py `
            --package (Join-Path $percentRoot "EventSwitchManager-ConsoleLab") `
            --report "apps/api/dist-console-lab/EventSwitchManager-ConsoleLab-smoke-percent-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content "apps/api/dist-console-lab/EventSwitchManager-ConsoleLab-smoke-percent-report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne "passed") { throw "ConsoleLab percent-path smoke did not pass." }
          Write-Output "ConsoleLab percent-path checks: $($report.checks -join ', ')"
      - name: Create ConsoleLab runtime checksum manifest
        if: always()
        shell: pwsh
        run: |
          $package = "apps/api/dist-console-lab/EventSwitchManager-ConsoleLab"
          $paths = @(
            "EventSwitchManager-ConsoleLab.exe",
            "EventSwitchManager-ConsoleLab-CLI.exe",
            "DEPENDENCIES-SHA256SUMS.txt",
            "EventSwitchManager-ConsoleLab-build-record.json",
            "instructions/README.zh-CN.txt",
            "instructions/H0-H4-ACCEPTANCE-TEMPLATE.txt"
          )
          $lines = foreach ($relative in $paths) {
            $full = Join-Path $package $relative
            if (-not (Test-Path $full)) { throw "Runtime checksum target missing: $relative" }
            $hash = (Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $package "SHA256SUMS.runtime"),
            $lines,
            (New-Object System.Text.UTF8Encoding($false))
          )
      - name: Upload ConsoleLab runtime (single extraction)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-console-lab
          if-no-files-found: warn
          include-hidden-files: true
          path: apps/api/dist-console-lab/EventSwitchManager-ConsoleLab/**
      - name: Upload ConsoleLab engineering archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-console-lab-build-archive
          if-no-files-found: warn
          path: |
            apps/api/dist-console-lab/EventSwitchManager-ConsoleLab-windows-x64.zip
            apps/api/dist-console-lab/EventSwitchManager-ConsoleLab-build-record.json
            apps/api/dist-console-lab/SHA256SUMS.console-lab
      - name: Upload ConsoleLab smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-console-lab-smoke-evidence
          if-no-files-found: warn
          path: |
            apps/api/dist-console-lab/EventSwitchManager-ConsoleLab-smoke-report.json
            apps/api/dist-console-lab/EventSwitchManager-ConsoleLab-smoke-percent-report.json
      - name: Download ConsoleLab artifact once
        uses: actions/download-artifact@v4
        with:
          name: windows-console-lab
          path: ${{ runner.temp }}/console-lab-downloaded
      - name: Verify one-extraction ConsoleLab runtime
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "console-lab-downloaded"
          $exe = Get-ChildItem -LiteralPath $root -Filter "EventSwitchManager-ConsoleLab.exe" -Recurse -File | Select-Object -First 1
          $cli = Get-ChildItem -LiteralPath $root -Filter "EventSwitchManager-ConsoleLab-CLI.exe" -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw "ConsoleLab GUI EXE missing after a single artifact extraction." }
          if (-not $cli) { throw "ConsoleLab CLI EXE missing after a single artifact extraction." }
          $nested = Get-ChildItem -LiteralPath $root -Filter "*.zip" -Recurse -File |
            Where-Object { $_.FullName -notmatch "\\_internal\\" -and $_.Name -ne "base_library.zip" }
          if ($nested) {
            throw "ConsoleLab user artifact still contains a nested build ZIP."
          }
          $package = $exe.Directory.FullName
          $checksums = Join-Path $package "SHA256SUMS.runtime"
          if (-not (Test-Path $checksums)) { throw "ConsoleLab runtime checksum manifest missing." }
          $checksumLines = Get-Content -LiteralPath $checksums
          foreach ($name in @("EventSwitchManager-ConsoleLab.exe", "EventSwitchManager-ConsoleLab-CLI.exe")) {
            $entry = $checksumLines | Where-Object { $_ -match "  $([regex]::Escape($name))$" } | Select-Object -First 1
            if (-not $entry) { throw "Checksum entry missing for $name" }
            $expected = ($entry -split "  ", 2)[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath (Join-Path $package $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "Checksum mismatch for $name" }
          }
          python apps/api/packaging/console_lab/smoke_console_lab.py `
            --package $package `
            --report (Join-Path $env:RUNNER_TEMP "console-lab-downloaded-smoke.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content (Join-Path $env:RUNNER_TEMP "console-lab-downloaded-smoke.json") -Raw | ConvertFrom-Json
          if ($report.status -ne "passed") { throw "Single-extraction ConsoleLab smoke did not pass." }
          Write-Output "One-extraction ConsoleLab checks: $($report.checks -join ', ')"

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan Git history
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner
