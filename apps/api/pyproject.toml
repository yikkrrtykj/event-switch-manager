[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "event-switch-manager"
version = "0.1.0"
description = "Local event network planning and deployment"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115.12,<1",
    "platformdirs>=4.3,<5",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0.40,<2.1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.15,<3", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
esm = "event_switch_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"event_switch_manager.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
